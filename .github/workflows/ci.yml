name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
      - run: docker build -f docker/Dockerfile.node-runner -t facet/node-actor-runner:1.0 .
      - run: npm run test:docker
