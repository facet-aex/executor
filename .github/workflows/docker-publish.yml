name: docker-publish
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
      - run: docker build -f docker/Dockerfile.node-runner -t facet/node-actor-runner:1.0 .
      - run: npm run test:docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.node-runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/facet-node-actor-runner:1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/facet-node-actor-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/facet-executor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/facet-executor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
