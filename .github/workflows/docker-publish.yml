name: docker-publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
      - run: docker build -f docker/Dockerfile.node-runner -t facet/node-actor-runner:1.0 .
      - run: npm run test:docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: runner_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/facet-node-actor-runner
          tags: |
            type=raw,value=1.0
            type=sha,format=short,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.node-runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.runner_meta.outputs.tags }}
          labels: ${{ steps.runner_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: executor_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/facet-executor
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.executor_meta.outputs.tags }}
          labels: ${{ steps.executor_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
